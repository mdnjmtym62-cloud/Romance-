<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Bocal des Parchemins 🫙✨</title>
    <!-- Importation d'une police manuscrite romantique -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #2c1d11, #4a2e18, #1a100a);
            font-family: 'Playfair Display', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f4e8d1;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            background: rgba(40, 25, 15, 0.75);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.2);
            max-width: 420px;
            width: 90%;
            border: 2px solid #d4af37;
            z-index: 1;
            position: relative;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #f3d584;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        p {
            font-size: 0.95rem;
            color: #d1c2a5;
            margin-bottom: 25px;
        }

        .jar-wrapper {
            position: relative;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
            margin: 10px 0;
        }
        .jar-wrapper:hover {
            transform: scale(1.05);
        }
        .jar-icon {
            font-size: 6rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        .btn-draw {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #2c1d11;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        .btn-draw:hover {
            background: linear-gradient(135deg, #f3d584, #d4af37);
            transform: translateY(-2px);
        }

        #scroll-container {
            margin-top: 25px;
            display: none;
            perspective: 1000px;
        }

        .scroll-paper {
            background: linear-gradient(to bottom, #f4e8d1, #e6d2b5, #f4e8d1);
            color: #3b220c;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 15px rgba(110, 75, 40, 0.3);
            border: 1px solid #c8a97e;
            position: relative;
            transform-origin: top;
            animation: unrollScroll 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            text-align: left;
        }

        .scroll-paper::before, .scroll-paper::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 10px;
            background: #b59467;
            border-radius: 50%;
        }
        .scroll-paper::before { top: -5px; }
        .scroll-paper::after { bottom: -5px; }

        @keyframes unrollScroll {
            0% { transform: scaleY(0.05) translateY(-50px); opacity: 0; }
            100% { transform: scaleY(1) translateY(0); opacity: 1; }
        }

        .scroll-paper h3 {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #8c281e;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        .scroll-paper p {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: #2c1d11;
            margin: 0;
            text-align: center;
            line-height: 1.4;
        }

        /* Boîte de mini-jeu "Tu veux continuer ?" au 3ème parchemin */
        #prank-box {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            border: 1px dashed #d4af37;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #prank-box p {
            font-size: 1rem;
            color: #f3d584;
            margin-bottom: 10px;
            text-align: center;
        }

        .prank-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 45px;
        }

        .btn-yes, .btn-no {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-family: 'Playfair Display', serif;
            transition: 0.1s;
        }

        .btn-yes {
            background-color: #ff416c;
            color: white;
            position: relative;
        }

        .btn-no {
            background-color: #4CAF50;
            color: white;
        }

        #timer-box {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #f3d584;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Le Bocal de l'Amour 🫙</h1>
        <p>30 parchemins secrets. Touche le bocal pour dérouler ton message du jour...</p>
        
        <div class="jar-wrapper" onclick="openJar()">
            <div class="jar-icon">🫙📜</div>
        </div>
        
        <button class="btn-draw" id="action-btn" onclick="openJar()">Piocher le parchemin ✨</button>

        <div id="timer-box"></div>

        <!-- Le parchemin interactif -->
        <div id="scroll-container">
            <div class="scroll-paper">
                <h3 id="scroll-title">Jour 1</h3>
                <p id="scroll-text">Texte du message...</p>
            </div>
        </div>

        <!-- Mini-jeu / Question au bout du 3ème parchemin -->
        <div id="prank-box">
            <p id="prank-question">Tu veux continuer ? 🧐</p>
            <div class="prank-buttons">
                <button class="btn-yes" id="btn-yes" onmouseover="moveButton()" onclick="moveButton()">Oui 🤭</button>
                <button class="btn-no" onclick="acceptContinue()">Non 😌</button>
            </div>
        </div>
    </div>

    <script>
        const messages30 = [
            "Jour 1 : Tu es la première pensée de mes matins et la plus douce de mes nuits. ❤️",
            "Jour 2 : J'adore ton sourire, c'est ce qui illumine mes journées les plus sombres. ✨",
            "Jour 3 : Merci d'être simplement toi, quelqu'un d'extraordinaire. 🌹",
            "Jour 4 : J'ai hâte de notre prochain moment rien qu'à tous les deux. 🥂",
            "Jour 5 : Même à distance ou occupés, tu es toujours dans mon cœur. 💭",
            "Jour 6 : Tu es mon plus beau hasard et ma plus belle certitude. 💫",
            "Jour 7 : Chacun de tes messages me fait fondre, ne change jamais. 🥰",
            "Jour 8 : J'aime la façon dont tu vois le monde et la douceur que tu y mets. 🌍",
            "Jour 9 : Tu me donnes envie d'être la meilleure version de moi-même. 🌟",
            "Jour 10 : Un tiers du chemin ! J'espère que tu penses à moi autant que je pense à toi. 💖",
            "Jour 11 : Ton rire est ma mélodie préférée au monde. 🎶",
            "Jour 12 : J'ai tellement de chance de t'avoir dans ma vie. 🍀",
            "Jour 13 : Tu es mon petit rayon de soleil quotidien. ☀️",
            "Jour 14 : Rien ne remplace la chaleur de ta présence. 🤗",
            "Jour 15 : À mi-chemin ! J'espère que ce petit rituel te fait sourire chaque jour. 💌",
            "Jour 16 : Tu es mon refuge, l'endroit où je me sens le plus bien. 🏡",
            "Jour 17 : J'admire ta force, ton intelligence et tout ce que tu accomplis. 💪",
            "Jour 18 : Petits ou grands moments, tout est mieux à tes côtés. 🌈",
            "Jour 19 : Tu es mon petit secret précieux. 🤫❤️",
            "Jour 20 : Plus que 10 jours dans le bocal, mais mon amour pour toi n'a pas de fin. ⏳",
            "Jour 21 : J'aime nos discussions qui durent des heures sans qu'on voie le temps passer. 🕒",
            "Jour 22 : Tu es incroyablement magnifique et tu le sais. 😉",
            "Jour 23 : Merci pour tout le bonheur que tu m'apportes au quotidien. 🎁",
            "Jour 24 : J'ai des étoiles plein les yeux dès que je pense à nous. ✨",
            "Jour 25 : Bientôt la fin du bocal, mais ce n'est que le début de notre histoire. 📖",
            "Jour 26 : Tu es mon coup de cœur permanent. 💘",
            "Jour 27 : J'aime ton grain de folie et ta douceur réunis. 🌺",
            "Jour 28 : Plus que deux jours... Prépare-toi à une surprise bientôt ! 🤫",
            "Jour 29 : Avant-dernier message : Je t'aime un peu, beaucoup, passionnément... à la folie ! 🔥",
            "Jour 30 : 30ème jour ! Le bocal est vide, mais mon amour pour toi grandit chaque jour un peu plus. Je t'embrasse fort ! 👑❤️"
        ];

        const excuses = [
            "Oups, raté ! 😜",
            "Essaye encore ! 🏃‍♀️",
            "C'est non le choix ! 😌",
            "Tu ne m'auras pas ! ✨",
            "Il faut cliquer sur Non ! 🛑",
            "Mauvais bouton ! 🤭"
        ];
        let excuseIndex = 0;

        function checkStatus() {
            const lastOpenTime = localStorage.getItem('lastOpenTime');
            const currentDayCount = parseInt(localStorage.getItem('dayCount') || '0');
            const now = new Date().getTime();

            if (currentDayCount >= 30) {
                document.getElementById('action-btn').style.display = 'none';
                document.querySelector('.jar-wrapper').style.display = 'none';
                document.getElementById('timer-box').style.display = 'block';
                document.getElementById('timer-box').innerText = "🎉 Tous les parchemins ont été ouverts ! Merci pour ce magnifique voyage.";
                return;
            }

            if (lastOpenTime) {
                const twentyFourHours = 24 * 60 * 60 * 1000;
                const elapsed = now - parseInt(lastOpenTime);
                
                if (elapsed < twentyFourHours) {
                    document.getElementById('action-btn').style.display = 'none';
                    document.getElementById('timer-box').style.display = 'block';
                    startCountdown(twentyFourHours - elapsed);
                    
                    const lastDay = parseInt(localStorage.getItem('lastDay') || '1');
                    showScrollContent(lastDay);
                }
            }
        }

        function openJar() {
            let currentDayCount = parseInt(localStorage.getItem('dayCount') || '0');
            
            if (currentDayCount >= 30) return;

            currentDayCount++;
            localStorage.setItem('dayCount', currentDayCount);
            localStorage.setItem('lastDay', currentDayCount);
            localStorage.setItem('lastOpenTime', new Date().getTime());

            showScrollContent(currentDayCount);

            // Si c'est exactement le 3ème parchemin et que le piège n'a pas encore été validé
            if (currentDayCount === 3 && !localStorage.getItem('prankDone')) {
                document.getElementById('prank-box').style.display = 'block';
            }

            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('timer-box').style.display = 'block';
            startCountdown(24 * 60 * 60 * 1000);
        }

        function showScrollContent(dayNum) {
            const scrollContainer = document.getElementById('scroll-container');
            scrollContainer.style.display = 'block';
            document.getElementById('scroll-title').innerText = `Parchemin du Jour ${dayNum}`;
            document.getElementById('scroll-text').innerText = messages30[dayNum - 1];

            // Si la page est rechargée et qu'on était au 3ème jour sans avoir cliqué sur "Non"
            if (dayNum === 3 && !localStorage.getItem('prankDone')) {
                document.getElementById('prank-box').style.display = 'block';
            } else if (dayNum === 3 && localStorage.getItem('prankDone')) {
                // Si elle a déjà cliqué sur Non lors d'une visite précédente, on affiche directement l'annonce
                document.getElementById('prank-box').style.display = 'block';
                document.getElementById('prank-box').innerHTML = "<p>💖 C’était une blague ma Princesse, continue de te faire plaisir.</p>";
            }
        }

        function moveButton() {
            const btnYes = document.getElementById('btn-yes');
            btnYes.innerText = excuses[excuseIndex];
            excuseIndex = (excuseIndex + 1) % excuses.length;

            const randomX = (Math.random() - 0.5) * 160;
            const randomY = (Math.random() - 0.5) * 80;
            btnYes.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function acceptContinue() {
            localStorage.setItem('prankDone', 'true');
            document.getElementById('prank-box').innerHTML = "<p style='font-size: 1.1rem; color: #f3d584; line-height: 1.5;'>💖 C’était une blague ma Princesse, continue de te faire plaisir.</p>";
        }

        function startCountdown(durationMs) {
            let timeLeft = durationMs;
            const timerBox = document.getElementById('timer-box');

            const interval = setInterval(() => {
                timeLeft -= 1000;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    localStorage.removeItem('lastOpenTime');
                    document.getElementById('action-btn').style.display = 'inline-block';
                    timerBox.style.display = 'none';
                    return;
                }

                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                timerBox.innerText = `⏳ Prochain parchemin dans : ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        window.onload = checkStatus;
    </script>
</body>
</html>
