<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Souvenirs 💖</title>
    <style>
        body {
            /* J'ai mis un dégradé plus doux pour laisser la place aux photos */
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333; /* Texte en gris foncé pour plus de contraste */
            overflow-x: hidden;
        }
        .container {
            /* Fond blanc avec un effet de flou plus léger */
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.17);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ff4b6e; /* Titre en rose */
        }
        p {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #555;
        }
        .btn-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background-color: #ff4b6e;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,75,110,0.3);
        }
        button:hover {
            background-color: #ff2a55;
            transform: scale(1.03);
        }
        #content-display {
            margin-top: 25px;
            display: none; /* Caché au départ */
            animation: fadeIn 0.5s ease;
        }
        #photo-container img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            display: block; /* Pour que l'image prenne toute la largeur */
        }
        #text-message {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Galerie de Notre Histoire 🤍</h1>
        <p>Clique pour redécouvrir un moment...</p>
        
        <div class="btn-box">
            <button onclick="showContent(1)">💌 Notre premier souvenir</button>
            <button onclick="showContent(2)">✨ Ce moment où j'ai su...</button>
            <button onclick="showContent(3)">🌹 Un futur à deux</button>
        </div>

        <!-- Cette partie va contenir la photo et le texte -->
        <div id="content-display">
            <div id="photo-container">
                <img id="displayed-photo" src="" alt="Souvenir">
            </div>
            <div id="text-message"></div>
        </div>
    </div>

    <script>
        function showContent(id) {
            const displayDiv = document.getElementById('content-display');
            const photo = document.getElementById('displayed-photo');
            const message = document.getElementById('text-message');

            displayDiv.style.display = 'block'; // On rend visible la zone

            // On change le contenu en fonction du bouton cliqué
            if (id === 1) {
                photo.src = "photo1.jpg"; // LE NOM DE TA PREMIÈRE PHOTO ICI
                message.innerHTML = "<b>Notre premier souvenir :</b> C'était le début de tout. Rien qu'en revoyant cette image, ça me donne le sourire. ❤️";
            } else if (id === 2) {
                photo.src = "photo2.jpg"; // LE NOM DE TA DEUXIÈME PHOTO ICI
                message.innerHTML = "<b>Ce moment où j'ai su...</b> C'était évident. Chaque jour avec toi me conforte dans ce choix. ✨";
            } else if (id === 3) {
                photo.src = "photo3.jpg"; // LE NOM DE TA TROISIÈME PHOTO ICI
                message.innerHTML = "<b>Un futur à deux :</b> J'ai hâte de construire le reste de notre histoire à tes côtés. 🌹";
            }
            
            // Fait défiler la page doucement pour que l'image soit bien visible
            displayDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
